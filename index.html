<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ff5722" />
    <title>Botlify — One place. Every booking channel.</title>
    <meta
      name="description"
      content="Botlify connects all 60+ channels, syncs every booking into one calendar, books guests automatically, and talks to them like a human would."
    />
    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Botlify — One place. Every booking channel." />
    <meta
      property="og:description"
      content="Connect all 60+ channels, sync every booking into one calendar, book guests automatically — Booking.com, Airbnb, Agoda, Expedia and more."
    />
    <meta property="og:image" content="/logo.png?v=4" />
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Botlify — One place. Every booking channel." />
    <meta
      name="twitter:description"
      content="Every booking channel, synced into one calendar. Books guests automatically and talks to them like a human would."
    />
    <meta name="twitter:image" content="/logo.png?v=4" />
    <!-- Google's favicon crawler checks /favicon.ico at the site root first and
         prefers a stable, unversioned URL — list it first, unversioned. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=4" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=4" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=4" />
    <link rel="icon" type="image/png" sizes="512x512" href="/logo.png?v=4" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=4" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
